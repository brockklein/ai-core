# repo.conf - the one place the guardrail scripts read project-specific settings from.
#
# Sourced (bash) by:
#   tooling/check-commit-subjects.sh   ISSUE_KEY_RE
#   tooling/hooks/pre-push             everything below
#   tooling/hooks/commit-msg           (through check-commit-subjects.sh)
#
# Every spot you must decide on carries a FILL marker. Run the starter kit's
#   scripts/check-fill-markers.sh <your repo>
# to list the ones left (that script ships with the starter kit, not with your repo). The
# defaults work as-is for a repo that lands agent work on `dev` and promotes `dev` to `main` by
# hand.
#
# Bash syntax: no spaces around `=`, quote values, arrays use ( ... ).

# --- Branches ---------------------------------------------------------------------------------

# FILL: the branch agents land finished work on. Pushes to it are checked (subjects, context,
# CHECK_COMMAND). Agents push here; humans promote it onward.
INTEGRATION_BRANCH="dev"

# FILL: branches no agent may update, space-separated. Only a human, through the promotion
# script, moves these. The pre-push hook refuses every update to them, deletes included.
PROTECTED_BRANCHES="main"

# The environment variable that lets one push update a protected branch. Set it only inside the
# promotion script (e.g. `ALLOW_PROTECTED_PUSH=1 git push origin dev:main`), never in a shell
# profile or an agent's environment. Its value must be exactly 1.
ALLOW_PROTECTED_PUSH_VAR="ALLOW_PROTECTED_PUSH"

# The remote that holds INTEGRATION_BRANCH. The hook compares topic branches against
# refs/remotes/$REMOTE/$INTEGRATION_BRANCH, so keep it fetched.
REMOTE="origin"

# --- Commit subjects --------------------------------------------------------------------------

# FILL: your tracker's issue-key pattern (POSIX extended regex, no anchors). Narrow it to your
# project key, e.g. 'ABC-[0-9]+', so typos like 'ABD-12' fail. The generic default accepts any
# Jira/Linear-style key.
# A subject must be "<issue key>: <subject>" or "<lowercase-area>: <subject>".
ISSUE_KEY_RE='[A-Z][A-Z0-9]+-[0-9]+'

# --- Context vs code --------------------------------------------------------------------------
#
# "Context" is everything an agent reads as instructions: docs, AGENTS.md, skills, agent
# settings, MCP config. A bad edit there changes how every later agent behaves, so context changes
# go through their own `context/<topic>` pull request that a human reviews. The pre-push hook
# refuses context on INTEGRATION_BRANCH and refuses topic branches that mix context with code.
#
# Entries are git glob pathspecs relative to the repo root: `**` crosses directories, a trailing
# `/` names a whole directory.

# FILL: add any other paths agents read as instructions (e.g. "docs/", ".cursor/").
CONTEXT_PATHS=(
  "**/*.md"
  "AGENTS.md"
  ".agents/"
  ".claude/"
  ".codex/"
  ".mcp.json"
)

# FILL: generated files that match CONTEXT_PATHS but are build output (e.g. a generated API
# client's README.md). They count as code. Leave empty if you have none.
GENERATED_PATHS=(
)

# --- Checks before landing --------------------------------------------------------------------

# FILL: the command the pre-push hook runs before a push to INTEGRATION_BRANCH, from the repo
# root, e.g. "npm test", "make check", "mise run check". A non-zero exit refuses the push. Empty
# skips it (the hook says so on every push). It reads the working tree, not the pushed commit, so
# push from a clean checkout of what you are pushing.
CHECK_COMMAND=""
